version: '3.9'

services:
  laravel-app:
    build: .
    container_name: laravel-app
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - .env
    networks:
      - default  
    expose:
      - "9000"
    restart: unless-stopped

networks:
  default:
    external:
      name: quranic-hub-network
